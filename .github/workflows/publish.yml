name: Build APK

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  publish:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x
    - name: Install Android workload
      run: dotnet workload install android
    - name: Patch Mono Runtime
      run: dotnet run --project LibPatcher silent patch
    - name: Publish
      run: dotnet publish ./SMAPIGameLoader/SMAPIGameLoader.csproj -c Release -f net9.0-android
    - name: Upload the APK
      uses: actions/upload-artifact@v4
      with:
        name: Built-APK
        path: SMAPIGameLoader/bin/Release/net9.0-android/publish/*.apk
        if-no-files-found: error
        retention-days: 90